<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Politics, Simply</title>
<meta name="description" content="Read political news from any country in simple English. Click any hard word to get an easy explanation.">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>Politics, <em>Simply</em></h1>
      <p>World political news, rewritten in plain English. Tap any hard word to understand it.</p>
    </div>
    <form class="controls" id="controls" autocomplete="off">
      <label>
        <span>Country</span>
        <select id="country"></select>
      </label>
      <label class="grow">
        <span>Search topic (optional)</span>
        <input id="q" type="search" placeholder="e.g. election, budget, protest">
      </label>
      <button type="submit" class="btn primary">Show news</button>
      <button type="button" class="btn" id="pasteBtn">Paste my own text</button>
    </form>
  </div>
</header>

<main class="wrap">
  <p class="status" id="status" role="status" aria-live="polite"></p>
  <section class="grid" id="grid" aria-label="News stories"></section>
</main>

<!-- Reader drawer -->
<div class="overlay" id="overlay" hidden></div>
<aside class="reader" id="reader" hidden aria-label="Simple English reader">
  <div class="reader-bar">
    <button class="btn small" id="closeReader" aria-label="Close reader">&larr; Back to stories</button>
    <a class="btn small" id="origLink" target="_blank" rel="noopener noreferrer" hidden>Open original &nearr;</a>
  </div>
  <div class="reader-body" id="readerBody"></div>
  <form class="ask" id="askForm" autocomplete="off">
    <input id="askInput" type="text" placeholder="Don't understand a word? Type it here…" maxlength="80">
    <button class="btn primary" type="submit">Explain</button>
  </form>
</aside>

<!-- Term popover -->
<div class="pop" id="pop" hidden role="dialog" aria-label="Word explanation"></div>
<button class="selbtn" id="selBtn" hidden>Explain this</button>

<footer class="wrap foot">
  <p>Stories come from several news APIs; if one runs out, another takes over. Explanations are written by AI &mdash; always check the original article for important decisions.</p>
</footer>

<script src="/app.js"></script>
</body>
</html>
